defaults:
  - _self_
  - launcher: local
  - data: aerialdojo_lang
  - model: vla_jepa

model_type: vla                   # -> core.trainer 走 VLAJEPA 分支（带真实语言 cross-attention）

output_model_name: lewm_vla_aerialdojo
subdir: ${hydra:job.id}

num_workers: 4
train_split: 0.9
seed: 3072
embed_dim: 64
history_size: 3

# AerialDojo 无人机动作集只有 6 类（forward/ascend/descend/rotl/rotr/stop），
# 不是原来的 8 类，必须让分类头输出 6 维，否则会预测出不存在的 left/right。
num_actions: 6

# 体素规格：A100 升级档（开颜色 + 分辨率翻倍）。
# ⚠️ 必须与 preprocess_aerialdojo.py 的 --z_cells/--y_cells/--x_cells/--voxel_size/--use_color/--samples 完全一致！
voxel_spec:
  z_cells: 32
  y_cells: 96
  x_cells: 96
  voxel_size: 0.25
  max_depth: 20.0
  z_min: -4.0
  use_color: true
  samples: 48

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 32
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 2
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

wandb:
  enabled: False
